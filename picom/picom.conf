backend = "glx";

opacity-rule = [
     "90:class_g = 'Rofi'",
     "85:class_g = 'Alacritty' && focused",
     "78:class_g = 'Alacritty' && !focused",
     "88:class_g = 'Thunar'",
     "90:class_g = 'Spotify'",
     "95:class_g = 'Brave-browser' && focused",
     "88:class_g = 'Brave-browser' && !focused"
    ];

#active-opacity = 1.0;
#inactive-opactiy = 0.85;

blur-background = "true"
blur-method = "dual_kawase";
blur-strength = 2;

fading = true;
fade-delta = 7;
fade-in-step = 0.03;
fade-out-step = 0.03;

corner-radius = 14

rounded-corners-exclude = [
  "window_type = 'dock'"
];

shadow = true
shadow-radius = 10;
shadow-opacity = 0.06;

blur-background-fixed = true;
